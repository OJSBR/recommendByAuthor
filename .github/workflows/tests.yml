name: Lint

# Checks that every PHP file of the plugin parses on each PHP version OJS 3.3 runs on.
# This line of the plugin (OJS 3.3) has no unit tests; its regression and
# Cypress suites need a populated installation with a journal. OJS 3.3 runs on
# PHP 7.3 and later, and this plugin needs PHP 7.4 or later (arrow functions).

on:
  push:
    branches: ['*']
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2']
    name: lint (PHP ${{ matrix.php }})
    steps:
      - name: Check out the plugin
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint
        run: |
          set +e
          status=0
          files=0
          while IFS= read -r -d '' file; do
            files=$((files + 1))
            out=$(php -l "$file" 2>&1) || { echo "$out"; status=1; }
          done < <(find . -name '*.php' -not -path './.git/*' -print0)
          echo "lint: $files files on PHP ${{ matrix.php }}, status $status"
          exit $status
