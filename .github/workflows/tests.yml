name: Lint

# Checks that every PHP file of the plugin parses on each PHP version OJS 3.5 runs on.
# The unit tests need the database of an OJS installation: they run in the
# continuous integration of PKP (stable-3_5_0.yml), together with the Cypress
# tests, on MySQL and PostgreSQL.

on:
  push:
    branches: ['*']
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    name: lint (PHP ${{ matrix.php }})
    steps:
      - name: Check out the plugin
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint
        run: |
          set +e
          status=0
          files=0
          while IFS= read -r -d '' file; do
            files=$((files + 1))
            out=$(php -l "$file" 2>&1) || { echo "$out"; status=1; }
          done < <(find . -name '*.php' -not -path './.git/*' -print0)
          echo "lint: $files files on PHP ${{ matrix.php }}, status $status"
          exit $status
